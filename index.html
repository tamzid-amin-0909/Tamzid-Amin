    <script>
        (function() {
            // 1. AUTO ENVIRONMENT ROUTING DETECTOR (Keeps your PHP API working!)
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const cleanPath = window.location.pathname.replace(/\/[^\/]+\.(html|php)$/i, '');
            const apiBaseUrl = window.location.origin + cleanPath + '/';

            // 2. NATIVE FETCH HIJACKER
            const nativeFetch = window.fetch;
            window.fetch = async function(input, init) {
                let url = typeof input === 'string' ? input : input.url;
                
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('//')) {
                    const cleanBase = apiBaseUrl.endsWith('/') ? apiBaseUrl : apiBaseUrl + '/';
                    const cleanUrl = url.startsWith('/') ? url.slice(1) : url;
                    url = `${cleanBase}${cleanUrl}`;
                }
                
                return typeof input === 'string' ? nativeFetch(url, init) : nativeFetch(new Request(url, input), init);
            };

            // 3. WATCHDOG TIMER (Reloads if scripts are blocked or fail to load)
            window.addEventListener('load', () => {
                setTimeout(() => {
                    // If the preloader wrapper is still fully visible after 2 seconds, trigger reset
                    const preloader = document.getElementById('app-preloader');
                    if (preloader && preloader.style.display !== 'none' && !preloader.classList.contains('opacity-0')) {
                        console.warn("Portal hung. Force clearing cache window view...");
                        window.location.reload();
                    }
                }, 2000);
            });
        })();
    </script>

<script>

let canClick = true;   // Controls whether click will trigger ad

// Changed 'true' to 'false' at the end to allow normal element interactions first
document.addEventListener('click', function(e) {
    if (!canClick) return;

    // Check if the user is clicking an input field or textarea
    const isInput = e.target.closest('input, textarea, [contenteditable="true"]');

    if (isInput) {
        // Force focus onto the input so the mobile keyboard pops up immediately
        e.target.focus();
        
        // Slightly delay the ad popup by 100ms. 
        // This gives the browser enough time to open the keyboard before the new tab steals focus.
        setTimeout(() => {
            window.open(adLink, '_blank');
        }, 100);
    } else {
        // If clicking anywhere else, open the ad immediately
        window.open(adLink, '_blank');
    }

    // Cooldown logic 
    canClick = false;
    setTimeout(() => {
        canClick = true;
    }, 6500); 

}, false); 
</script>
